<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>Learn BS</title>

		<!-- BS CSS CDN 4.0 -->

		<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css">

		<!-- Main CSS -->
		<link rel="stylesheet" type="text/css" href="css/style.css">

		
	</head>
	<body>

		<div class="container">
			<h2>Button</h2>
			<button type="button" class="btn btn-primary">Register Now</button>

			<a class="btn btn-primary" href="#">Rasister Now</a>

			<input class="btn btn-primary" type="submit" name="submit" value="Rasister Now">

		</div>

		<br>

		<div class="container">
			<h2>Outline Button</h2>

			<button class="btn btn-outline-primary" type="button">Resister Now</button>

			<a class="btn btn-outline-primary" href="#">Rasister Now</a>

			<input class="btn btn-outline-primary" type="submit" name="submit" value="Rasister Now">

			
		</div>

		<br>

		<div class="container">
			<h2>Block level Button</h2>

			<button class="btn btn-warning btn-block" type="button">Resister Now</button>

			<a class="btn btn-outline-primary btn-block" href="#">Rasister Now</a>

			<input class="btn btn-outline-warning btn-block" type="submit" name="submit" value="Rasister Now">

			
		</div>

		<br>

		<div class="container">
			<h2>Button Size</h2>

			<button class="btn btn-primary btn-sm" type="button">Resister Now</button>
			<button class="btn btn-primary" type="button">Resister Now</button>
			<button class="btn btn-primary btn-lg" type="button">Resister Now</button>
			<button class="btn btn-outline-primary btn-sm " type="button">Resister Now</button>
			<button class="btn btn-outline-primary " type="button">Resister Now</button>
			<button class="btn btn-outline-primary btn-lg" type="button">Resister Now</button>
			
			
		</div>

		<br>

		<div class="container">
			<h2>Button Group</h2>

			<div class="btn-group">

				<button class="btn btn-dark" type="button">Home</button>
				<button class="btn btn-dark" type="button">About</button>
				<button class="btn btn-outline-success" type="button">Services</button>
				<button class="btn btn-dark" type="button">Blog</button>
				<button class="btn btn-dark" type="button">Contract</button>
				
			</div>
			
		</div>

		<br>

		<div class="container">
			<h2>Button Group</h2>

			<div class="btn-group btn-group-sm">

				<button class="btn btn-primary" type="button">Home</button>
				<button class="btn btn-primary" type="button">About</button>
				<button class="btn btn-outline-success" type="button">Services</button>
				<button class="btn btn-primary" type="button">Blog</button>
				<button class="btn btn-primary" type="button">Contract</button>
				
			</div>
			
		</div>
		<br>

		<div class="container">
			<h2>Button Group</h2>

			<div class="btn-group">

				<button class="btn btn-primary" type="button">Home</button>
				<button class="btn btn-primary" type="button">About</button>
				<button class="btn btn-outline-success" type="button">Services</button>
				<button class="btn btn-primary" type="button">Blog</button>
				<button class="btn btn-primary" type="button">Contract</button>
				
			</div>
			
		</div>
		<br>
		<div class="container">
			<h2>Button Group</h2>

			<div class="btn-group btn-group-lg">

				<button class="btn btn-primary" type="button">Home</button>
				<button class="btn btn-primary" type="button">About</button>
				<button class="btn btn-outline-success" type="button">Services</button>
				<button class="btn btn-primary" type="button">Blog</button>
				<button class="btn btn-primary" type="button">Contract</button>
				
			</div>
			<div class="clearfix"></div>
			
		</div>

		<br>

		<div class="container">
			<h2>Button Group Outline</h2>

			<div class="btn-group btn-group-lg">

				<button class="btn btn-outline-danger" type="button">Home</button>
				<button class="btn btn-outline-dark" type="button">About</button>
				<button class="btn btn-outline-dark" type="button">Services</button>
				<button class="btn btn-outline-dark" type="button">Blog</button>
				<button class="btn btn-outline-dark" type="button">Contract</button>
				
			</div>
			<div class="clearfix"></div>
			
		</div>
		<br>















        <!-- Bs JS CDN 4.0 -->

		<script src="https://code.jquery.com/jquery-3.2.1.slim.min.js"></script>
		<script src="https://cdn.jsdelivr.net/npm/popper.js@1.12.9/dist/umd/popper.min.js"></script>
		<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/js/bootstrap.min.js"></script>

	</body>
</html>

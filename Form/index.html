<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>Learn BS ~ Form</title>

		<!-- BS CSS CDN 4.0 -->

		<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css">

		<!-- Main CSS -->
		<link rel="stylesheet" type="text/css" href="css/style.css">

    </head>
    <body>
    	<div class="container">

    		<form>
    			<div class="form-group">
    				<label for="fullname">Full Name</label>
    				<input class="form-control" type="text" name="fullname" id="fullname" placeholder="Your Full Name">
    				
    			</div>

    			<div class="form-group">
    				<label for="email">Email</label>
    				<input class="form-control" type="email" name="email" id="email" placeholder="Enter Your email">
    			</div>

    			<div class="form-group">
    				<label for="fullname">Address</label>
    				<input class="form-control" type="text" name="address" id="adress" placeholder="Your Address">
    				
    			</div>
    			
    			<div class="form-group">
    				<label for="fullname">Mobail Number</label>
    				<input class="form-control" type="number" name="mobail" id="mobail" placeholder="Enter Your Mobail Number">
    				
    			</div>

    			<div class="form-group">
    				<label for="picture">Picture</label>
    				<input class="form-control" type="file" name="picture" id="fullname" placeholder="Uploa your picture">
    				
    			</div>

    			<div class="form-row">
    				<div class="form-group col-md-6">
    					<label for="district">District</label>
    					<input class="form-control" type="text" name="district" id="district" placeholder="Enter Your District Name">
    					
    				</div>
    				<div class="form-group col-md-3">
    					<label for="strt">Stat</label>
    			        <select class="form-control" id="stat">

    			        	<option>Choose Your Strat</option>
    			        	<option>Dhaka</option>
    			        	<option>Shylhet</option>
    			        	<option>Chottogram</option>
    			        	<option>Rajshahi</option>
    			        	<option>Khulna</option>
    			        	<option>Barishal</option>
    			        	<option>Ranngpur</option>
    			        	<option>Mymensingh</option>
    			        	
    			        </select>
    					
    				</div>

    				<div class="form-group col-md-3">
    					<label for="zipcode">Zip Code</label>
    					<input class="form-control" type="text" name="zipcode" id="zipcode">
    					
    				</div>
    				
    			</div>

    			<div class="form-group">
    				<div class="form-check">
    					<input class="form-check-input" type="checkbox" name="check" id="check">
    					<label class="form-check-label" for="check">Check Me</label>
    					
    				</div>

    				<div class="col-12">
    					<button class="btn btn-primary" type="submit">Sign Up</button>
    					
    				</div>
    				
    			</div>

    			<div class="form-group">
    					<button class="btn btn-info" type="submit">Sign Up</button>
    					
    			</div>

    			<div class="clearfix"></div>






    		</form>
    		
    	</div>














		  <!-- Bs JS CDN 4.0 -->

		<script src="https://code.jquery.com/jquery-3.2.1.slim.min.js"></script>
		<script src="https://cdn.jsdelivr.net/npm/popper.js@1.12.9/dist/umd/popper.min.js"></script>
		<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/js/bootstrap.min.js"></script>
		<br><br><br><br><br><br><br>
	
	

	</body>
</html>
